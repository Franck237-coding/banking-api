services:
  # Service Web Spring Boot
  - type: web
    name: banking-api
    env: java
    plan: free
    buildCommand: "mvn clean package -DskipTests"
    startCommand: "java -jar target/banking-api-0.0.1-SNAPSHOT.jar"
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: neon
      - key: DATABASE_URL
        fromDatabase:
          name: banking-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: banking-db
          property: username
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: banking-db
          property: password
    autoDeploy: true

  # Base de données PostgreSQL
  - type: postgres
    name: banking-db
    plan: free
    ipAllowList: []
    databaseName: banking_db
    user: banking_user
